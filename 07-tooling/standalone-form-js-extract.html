<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>表单 JS 分析工具</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #f5f5f5;
      padding: 20px;
      line-height: 1.6;
    }
    .container {
      max-width: 1400px;
      margin: 0 auto;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 24px;
    }
    h1 {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 8px;
      color: #111;
    }
    .subtitle {
      font-size: 14px;
      color: #666;
      margin-bottom: 20px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }
    @media (max-width: 1024px) {
      .grid { grid-template-columns: 1fr; }
    }
    .panel {
      display: flex;
      flex-direction: column;
    }
    label {
      display: block;
      font-weight: 500;
      margin-bottom: 8px;
      font-size: 14px;
    }
    .hint {
      font-size: 12px;
      color: #999;
      margin-left: 8px;
    }
    textarea {
      width: 100%;
      font-family: "Courier New", Courier, monospace;
      font-size: 13px;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 4px;
      resize: vertical;
      background: #fafafa;
    }
    textarea:focus {
      outline: none;
      border-color: #4a90e2;
      background: white;
    }
    .button-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    button {
      padding: 8px 16px;
      border: 1px solid #ddd;
      border-radius: 4px;
      background: white;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
    }
    button:hover {
      background: #f0f0f0;
      border-color: #ccc;
    }
    button:active {
      background: #e0e0e0;
    }
    .stats {
      font-size: 14px;
      color: #16a34a;
      font-weight: 500;
    }
    .error {
      margin-top: 12px;
      padding: 12px;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 4px;
      color: #b91c1c;
      font-size: 14px;
    }
    .output-panel {
      position: relative;
    }
    .copy-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      padding: 6px 12px;
      font-size: 12px;
      background: white;
      border: 1px solid #ddd;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .copy-btn:hover {
      background: #f9fafb;
      border-color: #ccc;
    }
    .copy-btn.copied {
      background: #f0fdf4;
      border-color: #86efac;
      color: #166534;
    }
    .mapping-section {
      margin-top: 24px;
    }
    .mapping-label {

      gap: 8px;
      margin-bottom: 8px;
    }
    .mapping-hint {
      font-size: 12px;
      color: #999;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>表单 JS 分析</h1>
    <p class="subtitle">
      粘贴低代码表单 HTML，自动提取 JSP 片段中的 JS 代码，
      识别引用的控件（含子表行级引用）与未匹配 ID，生成 Markdown 报告。
      报告可直接复制给迁移 Agent 使用。
    </p>

    <div class="grid">
      <div class="panel">
        <label for="inputText">
          表单 HTML
          <span class="hint">内容自动保存在本地，刷新页面不会丢失</span>
        </label>
        <textarea
          id="inputText"
          rows="16"
          placeholder="在此粘贴低代码表单 HTML（含 fd_type / fd_values 属性的 TABLE 结构）..."
        ></textarea>
        <div id="errorBox"></div>
        <div class="button-row">
          <button id="clearBtn">清空</button>
          <button id="sampleBtn">加载示例</button>
          <span id="statsBox" class="stats"></span>
        </div>
      </div>

      <div class="panel output-panel">
        <label>Markdown 报告</label>
        <textarea
          id="reportText"
          rows="24"
          readonly
          placeholder="（粘贴表单 HTML 后自动生成报告）"
        ></textarea>
        <button class="copy-btn" id="copyReportBtn">复制</button>
      </div>
    </div>

    <div id="mappingSection" class="mapping-section" style="display: none;">
      <div class="mapping-label">
        <label>字段映射模板</label>
        <span class="mapping-hint">复制到新系统 JS 编辑器，对照 label 点击字段获取新 ID</span>
      </div>
      <div class="output-panel">
        <textarea
          id="mappingText"
          rows="12"
          readonly
        ></textarea>
        <button class="copy-btn" id="copyMappingBtn">复制</button>
      </div>
    </div>
  </div>

  <script>
// ============================================================
// 常量
// ============================================================

const XFORM_APIS_BY_ID = [
  "GetXFormFieldById",
  "GetXFormFieldValueById",
  "SetXFormFieldValueById",
  "AttachXFormValueChangeEventById",
];

const XFORM_APIS_BY_LABEL = [
  "GetXFormFieldByLabel",
  "GetXFormFieldValueByLabel",
  "SetXFormFieldValueByLabel",
  "AttachXFormValueChangeEventByLabel",
];

const NON_CONTROL_FD_TYPES = new Set(["standardTable", "detailsTable", "jsp"]);
const NON_BUSINESS_FD_TYPES = new Set(["textLabel", "brcontrol"]);

const API_ROLE_MAP = {
  GetXFormFieldById: "read",
  GetXFormFieldValueById: "read",
  SetXFormFieldValueById: "write",
  AttachXFormValueChangeEventById: "listen",
};

const ROLE_ORDER = ["read", "write", "listen"];

const ROLE_LABEL = {
  read: "读取",
  write: "写入",
  listen: "监听",
};

const JDBC_DATASET_BASE_URL =
  "http://hetest.vanward.com:4430/sys/xform/maindata/jdbc_data_set/xFormjdbcDataSet.do?method=view&fdId=";

const INPUT_STORAGE_KEY = "formJsExtract:input";

// ============================================================
// 工具函数
// ============================================================

function escapeRegExp(str) {
  return str.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
}

function parseFdValues(str) {
  const result = {};
  if (!str) return result;

  const s = str.trim();
  if (!s.startsWith("{") || !s.endsWith("}")) {
    const re = /([a-zA-Z_][a-zA-Z0-9_]*)\s*:\s*"([^"]*)"/g;
    let m;
    while ((m = re.exec(s)) !== null) result[m[1]] = m[2];
    return result;
  }

  const inner = s.slice(1, -1);
  let i = 0;

  while (i < inner.length) {
    while (i < inner.length && (inner[i] === "," || /\s/.test(inner[i]))) i++;
    if (i >= inner.length) break;

    const keyRe = /^([a-zA-Z_][a-zA-Z0-9_]*)\s*:\s*/;
    const keyMatch = keyRe.exec(inner.slice(i));
    if (!keyMatch) {
      i++;
      continue;
    }
    const key = keyMatch[1];
    i += keyMatch[0].length;
    if (i >= inner.length) break;

    const ch = inner[i];
    if (ch === '"') {
      let j = i + 1;
      let value = "";
      while (j < inner.length) {
        const c = inner[j];
        if (c === "\\" && j + 1 < inner.length) {
          value += inner[j + 1];
          j += 2;
          continue;
        }
        if (c === '"') break;
        value += c;
        j++;
      }
      result[key] = value;
      i = j + 1;
    } else if (ch === "{" || ch === "[") {
      let nested = 1;
      let j = i + 1;
      let inString = false;
      while (j < inner.length && nested > 0) {
        const c = inner[j];
        if (inString) {
          if (c === "\\") { j += 2; continue; }
          if (c === '"') inString = false;
        } else {
          if (c === '"') inString = true;
          else if (c === "{" || c === "[") nested++;
          else if (c === "}" || c === "]") nested--;
        }
        j++;
      }
      i = j;
    } else {
      let j = i;
      while (j < inner.length && inner[j] !== ",") j++;
      result[key] = inner.slice(i, j).trim();
      i = j;
    }
  }

  return result;
}

function cleanJs(rawValue) {
  let js = rawValue || "";
  let hadScriptWrapper = false;

  const scriptRe = /^\s*<script\b[^>]*>([\s\S]*?)<\/script>\s*$/i;
  const m = js.match(scriptRe);
  if (m) {
    js = m[1];
    hadScriptWrapper = true;
  }

  js = js.replace(/\r\n?/g, "\n");
  js = js.split("\n").map((l) => l.replace(/[ \t]+$/, "")).join("\n");
  js = js.replace(/\n{3,}/g, "\n\n");
  js = js.replace(/^\n+/, "").replace(/\n+$/, "");

  return { cleanedJs: js, hadScriptWrapper };
}

function parseForm(html) {
  const warnings = [];
  const doc = new DOMParser().parseFromString(html, "text/html");

  const tables = [];
  const seenTableIds = new Set();
  const tableEls = doc.querySelectorAll(
    '[fd_type="standardTable"], [fd_type="detailsTable"]'
  );
  tableEls.forEach((el) => {
    const fdType = el.getAttribute("fd_type");
    const fdValues = parseFdValues(el.getAttribute("fd_values") || "");
    const id = fdValues.id || el.getAttribute("id") || "";
    if (!id || seenTableIds.has(id)) return;
    seenTableIds.add(id);
    tables.push({
      id,
      fdType,
      label: fdValues.label || "",
      isMain: fdType === "standardTable",
    });
  });

  const controls = [];
  const seenControlIds = new Set();
  const allFdTypeEls = doc.querySelectorAll("[fd_type]");
  allFdTypeEls.forEach((el) => {
    const fdType = el.getAttribute("fd_type") || "";
    if (!fdType || NON_CONTROL_FD_TYPES.has(fdType)) return;

    const fdValuesRaw = el.getAttribute("fd_values") || "";
    const fdValues = parseFdValues(fdValuesRaw);

    let id = fdValues.id || el.getAttribute("id") || "";
    if (!id) {
      const childWithId = el.querySelector("[id]");
      if (childWithId) id = childWithId.getAttribute("id") || "";
    }

    if (!id || seenControlIds.has(id)) return;
    seenControlIds.add(id);

    let label =
      fdValues.label ||
      fdValues.content ||
      el.getAttribute("label") ||
      "";
    if (!label) {
      label = (el.textContent || "").trim();
    }

    let tableName = el.getAttribute("tableName") || "";
    if (!tableName) {
      const childWithTableName = el.querySelector("[tableName]");
      if (childWithTableName) {
        tableName = childWithTableName.getAttribute("tableName") || "";
      }
    }
    if (!tableName) {
      let parent = el.parentElement;
      while (parent) {
        const pt = parent.getAttribute("fd_type");
        if (pt === "standardTable" || pt === "detailsTable") {
          const pv = parseFdValues(parent.getAttribute("fd_values") || "");
          tableName = pv.id || parent.getAttribute("id") || "";
          break;
        }
        parent = parent.parentElement;
      }
    }

    controls.push({
      id,
      fdType,
      label,
      tableName,
      canShow: fdValues.canShow !== "false",
      isBusiness: !NON_BUSINESS_FD_TYPES.has(fdType),
    });
  });

  const jspFragments = [];
  const jspEls = doc.querySelectorAll('[fd_type="jsp"]');
  jspEls.forEach((el) => {
    const fdValues = parseFdValues(el.getAttribute("fd_values") || "");
    const id = fdValues.id || el.getAttribute("id") || "";
    const input = el.querySelector('input[type="hidden"]');
    if (!input) {
      warnings.push(`JSP 片段 ${id || "(未知 id)"} 未找到 input[type=hidden]，内容为空`);
      jspFragments.push({ id, rawValue: "", cleanedJs: "", hadScriptWrapper: false });
      return;
    }
    const rawValue = input.value || input.getAttribute("value") || "";
    const { cleanedJs, hadScriptWrapper } = cleanJs(rawValue);
    jspFragments.push({ id, rawValue, cleanedJs, hadScriptWrapper });
  });

  return { tables, controls, jspFragments, parseWarnings: warnings };
}

function scanReferences(js, controls, tables) {
  if (!js) return [];

  const controlIdSet = new Set(controls.map((c) => c.id));
  const subTableIds = tables.filter((t) => !t.isMain).map((t) => t.id);

  const refMap = new Map();
  const ensureRef = (controlId) => {
    let ref = refMap.get(controlId);
    if (!ref) {
      ref = {
        controlId,
        directCount: 0,
        subTableRowOccurrences: [],
        byLabelApis: [],
        roles: [],
      };
      refMap.set(controlId, ref);
    }
    return ref;
  };

  for (const [apiName, role] of Object.entries(API_ROLE_MAP)) {
    const apiEscaped = escapeRegExp(apiName);
    const re = new RegExp(
      `\\b${apiEscaped}\\s*\\(\\s*["']([^"']+)["']`,
      "g"
    );
    let m;
    while ((m = re.exec(js)) !== null) {
      const arg = m[1];
      if (controlIdSet.has(arg)) {
        const ref = ensureRef(arg);
        if (!ref.roles.includes(role)) ref.roles.push(role);
        continue;
      }
      const rowMatch = /^([A-Za-z_][A-Za-z0-9_]*)\.\d+\.([A-Za-z_][A-Za-z0-9_]*)$/.exec(arg);
      if (rowMatch && controlIdSet.has(rowMatch[2])) {
        const ref = ensureRef(rowMatch[2]);
        if (!ref.roles.includes(role)) ref.roles.push(role);
      }
    }
  }

  const subRowCountPerFieldId = new Map();
  for (const stId of subTableIds) {
    const re = new RegExp(
      `\\b${escapeRegExp(stId)}\\.(\\d+)\\.([A-Za-z_][A-Za-z0-9_]*)\\b`,
      "g"
    );
    let m;
    while ((m = re.exec(js)) !== null) {
      const rowIndex = Number(m[1]);
      const fieldId = m[2];
      if (controlIdSet.has(fieldId)) {
        const ref = ensureRef(fieldId);
        ref.subTableRowOccurrences.push({ subTableId: stId, rowIndex });
        subRowCountPerFieldId.set(
          fieldId,
          (subRowCountPerFieldId.get(fieldId) || 0) + 1
        );
      }
    }
  }

  for (const id of controlIdSet) {
    const re = new RegExp(`\\b${escapeRegExp(id)}\\b`, "g");
    const total = (js.match(re) || []).length;
    if (total === 0) continue;
    const subCount = subRowCountPerFieldId.get(id) || 0;
    const directCount = Math.max(0, total - subCount);
    const ref = ensureRef(id);
    ref.directCount = directCount;
  }

  return Array.from(refMap.values()).filter(
    (r) => r.directCount > 0 || r.subTableRowOccurrences.length > 0
  );
}

function detectUnmatched(js, controls, tables) {
  if (!js) return [];

  const controlIdSet = new Set(controls.map((c) => c.id));
  const tableIdSet = new Set(tables.map((t) => t.id));

  const candidates = [];
  let m;

  const xformRe = new RegExp(
    `(${XFORM_APIS_BY_ID.join("|")})\\s*\\(\\s*["']([^"']+)["']`,
    "g"
  );
  while ((m = xformRe.exec(js)) !== null) {
    candidates.push({ rawArg: m[2], apiName: m[1] });
  }

  const domRe = /document\.getElementById\s*\(\s*["']([^"']+)["']/g;
  while ((m = domRe.exec(js)) !== null) {
    candidates.push({ rawArg: m[1], apiName: "document.getElementById" });
  }

  const jqRe = /\$\s*\(\s*["']#([^"']+)["']/g;
  while ((m = jqRe.exec(js)) !== null) {
    candidates.push({ rawArg: m[1], apiName: "$" });
  }

  const dedupMap = new Map();
  for (const { rawArg, apiName } of candidates) {
    let reason = null;

    const qualified = rawArg.match(/^([^.]+)\.(\d+)\.([^.]+)$/);
    if (qualified) {
      const part1 = qualified[1];
      const part3 = qualified[3];
      if (!tableIdSet.has(part1)) {
        reason = "unknown-sub-table";
      } else if (!controlIdSet.has(part3)) {
        reason = "unknown-field-in-sub-table";
      }
    } else {
      if (!controlIdSet.has(rawArg) && !tableIdSet.has(rawArg)) {
        reason = "unknown-id";
      }
    }

    if (!reason) continue;

    const key = `${rawArg}\u0000${reason}`;
    const existing = dedupMap.get(key);
    if (existing) {
      if (!existing.apiNames.includes(apiName)) existing.apiNames.push(apiName);
    } else {
      dedupMap.set(key, {
        rawArgument: rawArg,
        apiNames: [apiName],
        reason,
      });
    }
  }

  return Array.from(dedupMap.values());
}

function detectGlobalHooks(js) {
  if (!js) {
    return { declaresXFormOnValueChange: false, xFormOnValueChangeFunsPushCount: 0 };
  }
  const declaresXFormOnValueChange =
    /function\s+XFormOnValueChange\s*\(/.test(js) ||
    /XFormOnValueChange\s*=\s*function/.test(js) ||
    /(?:const|let|var)\s+XFormOnValueChange\s*=/.test(js);
  const xFormOnValueChangeFunsPushCount =
    (js.match(/XFormOnValueChangeFuns\s*\.\s*push\s*\(/g) || []).length;
  return { declaresXFormOnValueChange, xFormOnValueChangeFunsPushCount };
}

function detectLabelReferences(js, controls) {
  if (!js) return [];
  const results = [];
  const re = new RegExp(
    `(${XFORM_APIS_BY_LABEL.join("|")})\\s*\\(\\s*["']([^"']+)["']`,
    "g"
  );
  let m;
  while ((m = re.exec(js)) !== null) {
    const apiName = m[1];
    const label = m[2];
    const matchedControlIds = controls
      .filter((c) => c.label === label)
      .map((c) => c.id);
    results.push({ apiName, label, matchedControlIds });
  }
  return results;
}

function detectJdbcDataCalls(js) {
  if (!js) return { references: [], totalCalls: 0 };

  const allCallsRe = /\bGetJdbcData\s*\(/g;
  const totalCalls = (js.match(allCallsRe) || []).length;

  const results = [];
  const seen = new Set();
  const literalRe = /GetJdbcData\s*\(\s*["']([^"']+)["']/g;
  let m;
  while ((m = literalRe.exec(js)) !== null) {
    const datasetId = m[1];
    if (seen.has(datasetId)) continue;
    seen.add(datasetId);

    const afterFirstParam = js.slice(m.index + m[0].length);
    const source = extractNthParamString(afterFirstParam, 2);

    results.push({
      datasetId,
      source: source || "",
      link: `${JDBC_DATASET_BASE_URL}${datasetId}`,
    });
  }
  return { references: results, totalCalls };
}

function extractNthParamString(str, n) {
  let depth = 0;
  let commaCount = 0;
  let i = 0;
  let inString = false;
  let stringChar = "";

  while (i < str.length) {
    const c = str[i];
    if (inString) {
      if (c === "\\") { i += 2; continue; }
      if (c === stringChar) inString = false;
      i++;
      continue;
    }
    if (c === '"' || c === "'") {
      inString = true;
      stringChar = c;
      i++;
      continue;
    }
    if (c === "{" || c === "[" || c === "(") { depth++; i++; continue; }
    if (c === "}" || c === "]" || c === ")") {
      depth--;
      if (depth < 0) return null;
      i++;
      continue;
    }
    if (c === "," && depth === 0) {
      commaCount++;
      if (commaCount === n) {
        let j = i + 1;
        while (j < str.length && /\s/.test(str[j])) j++;
        if (j < str.length && (str[j] === '"' || str[j] === "'")) {
          const quote = str[j];
          let end = j + 1;
          while (end < str.length) {
            if (str[end] === "\\") { end += 2; continue; }
            if (str[end] === quote) break;
            end++;
          }
          if (end < str.length) return str.slice(j + 1, end);
        }
        return null;
      }
    }
    i++;
  }
  return null;
}

function formatTableOrigin(tableName, tableMap) {
  if (!tableName) return "(未归属)";
  const t = tableMap.get(tableName);
  if (!t) return `(未知表: ${tableName})`;
  return t.isMain ? "主表" : `子表: ${t.label || "(无 label)"}`;
}

function reasonLabel(reason) {
  switch (reason) {
    case "unknown-id":
      return "未知 ID";
    case "unknown-sub-table":
      return "未知子表";
    case "unknown-field-in-sub-table":
      return "子表字段未知";
    default:
      return reason;
  }
}

function formatRoles(roles) {
  if (!roles || roles.length === 0) return "—";
  const sorted = ROLE_ORDER.filter((r) => roles.includes(r));
  return sorted.map((r) => ROLE_LABEL[r]).join(" · ");
}

function buildMarkdownReport(result) {
  const lines = [];
  const {
    parsed,
    mergedJs,
    references,
    unmatchedReferences,
    globalHooks,
    labelReferences,
    jdbcDataReferences,
    jdbcDataTotalCalls,
  } = result;

  const tableMap = new Map(parsed.tables.map((t) => [t.id, t]));
  const controlMap = new Map(parsed.controls.map((c) => [c.id, c]));

  lines.push("# 表单 JS 分析报告", "");

  lines.push("## 表单元信息", "");
  const mainTables = parsed.tables.filter((t) => t.isMain);
  const subTables = parsed.tables.filter((t) => !t.isMain);

  if (mainTables.length === 0) {
    lines.push("- **主表**：（本次无）");
  } else if (mainTables.length === 1) {
    const t = mainTables[0];
    lines.push(`- **主表**：\`${t.id}\`（${t.label || "(无 label)"}）`);
  } else {
    lines.push("- **主表**：");
    for (const t of mainTables) {
      lines.push(`  - \`${t.id}\`（${t.label || "(无 label)"}）`);
    }
  }

  if (subTables.length === 0) {
    lines.push("- **子表**：（本次无）");
  } else {
    lines.push("- **子表**：");
    for (const t of subTables) {
      lines.push(`  - \`${t.id}\`（${t.label || "(无 label)"}）`);
    }
  }

  const businessControlCount = parsed.controls.filter((c) => c.isBusiness).length;
  lines.push(`- **业务控件总数**：${businessControlCount}`);
  lines.push(`- **JSP 片段数量**：${parsed.jspFragments.length}`);
  lines.push("");

  lines.push("## JS 片段（合并）", "");
  if (parsed.jspFragments.length === 0) {
    lines.push("（表单中未找到 JSP 片段）", "");
  } else {
    lines.push("```javascript");
    lines.push(mergedJs);
    lines.push("```", "");
  }

  lines.push("## JS 引用的控件", "");
  if (references.length === 0) {
    lines.push("（本次无）", "");
  } else {
    lines.push("| 控件 ID | label | 类型 | 所属表 | 直接引用 | 行级引用 | 入参/出参 |");
    lines.push("|---|---|---|---|---|---|---|");
    for (const ref of references) {
      const c = controlMap.get(ref.controlId);
      if (!c) continue;
      const label = c.label || "(无 label)";
      const origin = formatTableOrigin(c.tableName, tableMap);
      const direct = ref.directCount > 0 ? String(ref.directCount) : "—";
      const subRow =
        ref.subTableRowOccurrences.length > 0
          ? String(ref.subTableRowOccurrences.length)
          : "—";
      const rolesText = formatRoles(ref.roles);
      lines.push(
        `| \`${c.id}\` | ${label} | ${c.fdType} | ${origin} | ${direct} | ${subRow} | ${rolesText} |`
      );
    }
    lines.push("");
  }

  lines.push("## 未匹配引用", "");
  if (unmatchedReferences.length === 0) {
    lines.push("（本次无）", "");
  } else {
    lines.push("| 原始参数 | 出现的 API | 未匹配原因 |");
    lines.push("|---|---|---|");
    for (const u of unmatchedReferences) {
      const apis = u.apiNames.map((a) => `\`${a}\``).join(", ");
      lines.push(
        `| \`${u.rawArgument}\` | ${apis} | ${reasonLabel(u.reason)} |`
      );
    }
    lines.push("");
  }

  lines.push("## 全局钩子", "");
  const hookLines = [];
  if (globalHooks.declaresXFormOnValueChange) {
    hookLines.push("- 声明了 `XFormOnValueChange` 全局函数");
  }
  if (globalHooks.xFormOnValueChangeFunsPushCount > 0) {
    hookLines.push(
      `- \`XFormOnValueChangeFuns.push\` 调用次数：${globalHooks.xFormOnValueChangeFunsPushCount}`
    );
  }
  if (hookLines.length === 0) {
    lines.push("（本次无）", "");
  } else {
    lines.push(...hookLines, "");
  }

  lines.push("## 按 label 引用", "");
  if (labelReferences.length === 0) {
    lines.push("（本次无）", "");
  } else {
    lines.push("| API | label 参数 | 匹配到的控件 |");
    lines.push("|---|---|---|");
    for (const lr of labelReferences) {
      const matched =
        lr.matchedControlIds.length > 0
          ? lr.matchedControlIds.map((id) => `\`${id}\``).join(", ")
          : "(未匹配)";
      lines.push(`| \`${lr.apiName}\` | ${lr.label} | ${matched} |`);
    }
    lines.push("");
  }

  lines.push("## 数据集调用", "");
  if (jdbcDataTotalCalls === 0) {
    lines.push("（本次无）", "");
  } else {
    lines.push(`\`GetJdbcData\` 调用次数：${jdbcDataTotalCalls}`, "");
    if (jdbcDataReferences.length > 0) {
      lines.push("| 数据集 ID | 数据源 | 定义链接 |");
      lines.push("|---|---|---|");
      for (const jr of jdbcDataReferences) {
        const source = jr.source || "—";
        lines.push(
          `| \`${jr.datasetId}\` | ${source} | [查看](${jr.link}) |`
        );
      }
      const unidentified = jdbcDataTotalCalls - jdbcDataReferences.length;
      if (unidentified > 0) {
        lines.push(
          "",
          `> 另有 ${unidentified} 次调用的数据集 ID 为变量，无法静态提取。`
        );
      }
      lines.push("");
    } else {
      lines.push("（数据集 ID 均为变量，无法静态提取）", "");
    }
  }

  if (parsed.parseWarnings.length > 0) {
    lines.push("## 解析警告", "");
    for (const w of parsed.parseWarnings) {
      lines.push(`- ${w}`);
    }
    lines.push("");
  }

  return lines.join("\n");
}

function buildMappingTemplate(result) {
  const { references, parsed } = result;
  if (references.length === 0) return "";

  const controlMap = new Map(parsed.controls.map((c) => [c.id, c]));
  const tableMap = new Map(parsed.tables.map((t) => [t.id, t]));
  const lines = [];

  lines.push(`字段映射（共 ${references.length} 个）`);
  lines.push("");

  let idx = 1;
  for (const ref of references) {
    const ctrl = controlMap.get(ref.controlId);
    if (!ctrl) continue;

    const label = ctrl.label || "(无 label)";
    const fdType = ctrl.fdType;
    const rolesText = formatRoles(ref.roles);
    const table = tableMap.get(ctrl.tableName);
    const origin = table
      ? table.isMain
        ? "主表"
        : `子表: ${table.label || ctrl.tableName}`
      : "(未归属)";

    lines.push(`${idx}. 旧ID: ${ctrl.id}`);
    lines.push(`   label: ${label} | 类型: ${fdType} | 所属: ${origin} | 角色: ${rolesText}`);
    lines.push(`   新ID: `);
    lines.push("");
    idx++;
  }

  return lines.join("\n");
}

function analyzeHtml(html) {
  const parsed = parseForm(html);

  const mergedJs = parsed.jspFragments
    .map(
      (f) =>
        `// ==== JSP 片段: ${f.id || "(未知 id)"} ====\n${f.cleanedJs}`
    )
    .join("\n\n");

  const references = scanReferences(mergedJs, parsed.controls, parsed.tables);
  const unmatchedReferences = detectUnmatched(
    mergedJs,
    parsed.controls,
    parsed.tables
  );
  const globalHooks = detectGlobalHooks(mergedJs);
  const labelReferences = detectLabelReferences(mergedJs, parsed.controls);
  const jdbcResult = detectJdbcDataCalls(mergedJs);

  for (const lr of labelReferences) {
    for (const cid of lr.matchedControlIds) {
      let ref = references.find((r) => r.controlId === cid);
      if (!ref) {
        ref = {
          controlId: cid,
          directCount: 0,
          subTableRowOccurrences: [],
          byLabelApis: [],
          roles: [],
        };
        references.push(ref);
      }
      if (!ref.byLabelApis.includes(lr.apiName)) {
        ref.byLabelApis.push(lr.apiName);
      }
    }
  }

  const result = {
    parsed,
    mergedJs,
    references,
    unmatchedReferences,
    globalHooks,
    labelReferences,
    jdbcDataReferences: jdbcResult.references,
    jdbcDataTotalCalls: jdbcResult.totalCalls,
    markdown: "",
    mappingTemplate: "",
  };
  result.markdown = buildMarkdownReport(result);
  result.mappingTemplate = buildMappingTemplate(result);
  return result;
}

// ============================================================
// UI 逻辑
// ============================================================

const inputText = document.getElementById("inputText");
const reportText = document.getElementById("reportText");
const mappingText = document.getElementById("mappingText");
const mappingSection = document.getElementById("mappingSection");
const errorBox = document.getElementById("errorBox");
const statsBox = document.getElementById("statsBox");
const clearBtn = document.getElementById("clearBtn");
const sampleBtn = document.getElementById("sampleBtn");
const copyReportBtn = document.getElementById("copyReportBtn");
const copyMappingBtn = document.getElementById("copyMappingBtn");

function readStoredInput() {
  try {
    return localStorage.getItem(INPUT_STORAGE_KEY) || "";
  } catch {
    return "";
  }
}

function writeStoredInput(value) {
  try {
    if (value) {
      localStorage.setItem(INPUT_STORAGE_KEY, value);
    } else {
      localStorage.removeItem(INPUT_STORAGE_KEY);
    }
  } catch {
    // 存储配额不足时忽略
  }
}

function applyInput(value) {
  inputText.value = value;
  writeStoredInput(value);
  updateReport();
}

function updateReport() {
  const html = inputText.value;
  errorBox.innerHTML = "";
  statsBox.textContent = "";
  reportText.value = "";
  mappingText.value = "";
  mappingSection.style.display = "none";

  if (!html.trim()) {
    reportText.placeholder = "（粘贴表单 HTML 后自动生成报告）";
    return;
  }

  try {
    const result = analyzeHtml(html);
    reportText.value = result.markdown;
    
    if (result.mappingTemplate) {
      mappingText.value = result.mappingTemplate;
      mappingSection.style.display = "block";
    }

    const mainCount = result.parsed.tables.filter((t) => t.isMain).length;
    const subCount = result.parsed.tables.filter((t) => !t.isMain).length;
    const ctrlCount = result.parsed.controls.filter((c) => c.isBusiness).length;
    const jspCount = result.parsed.jspFragments.length;
    const refCount = result.references.length;
    const unCount = result.unmatchedReferences.length;

    statsBox.textContent = `主表 ${mainCount} / 子表 ${subCount} · 控件 ${ctrlCount} · JSP 片段 ${jspCount} · 引用 ${refCount} · 未匹配 ${unCount}`;
  } catch (e) {
    const msg = e instanceof Error ? e.message : "未知错误";
    errorBox.innerHTML = `<div class="error">解析失败: ${msg}</div>`;
  }
}

function copyToClipboard(text, button) {
  navigator.clipboard.writeText(text).then(() => {
    const originalText = button.textContent;
    button.textContent = "已复制";
    button.classList.add("copied");
    setTimeout(() => {
      button.textContent = originalText;
      button.classList.remove("copied");
    }, 2000);
  });
}

// 初始化
const stored = readStoredInput();
if (stored) {
  inputText.value = stored;
  updateReport();
}

// 事件绑定
inputText.addEventListener("input", () => {
  applyInput(inputText.value);
});

clearBtn.addEventListener("click", () => {
  applyInput("");
});

sampleBtn.addEventListener("click", () => {
  applyInput(SAMPLE_FORM_HTML);
});

copyReportBtn.addEventListener("click", () => {
  if (reportText.value) {
    copyToClipboard(reportText.value, copyReportBtn);
  }
});

copyMappingBtn.addEventListener("click", () => {
  if (mappingText.value) {
    copyToClipboard(mappingText.value, copyMappingBtn);
  }
});
